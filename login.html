<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Madiha Digital Store</title>

    <!-- Browser Tab Image -->
    <link rel="icon" type="image/png" href="imge3.png.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <!-- Madiha DP -->

        <img
            src="imge2.png.png.png"
            alt="Madiha"
            class="profile-pic"
        >

        <h1>Madiha Digital Store</h1>

        <p>Welcome Back</p>

    </header>


    <!-- LOGIN SECTION -->

    <section class="order-section">

        <div class="order-card">

            <h2>Login</h2>

            <p class="order-subtitle">
                Login to your account
            </p>


            <!-- EMAIL -->

            <label for="loginEmail">
                Email Address
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >


            <!-- PASSWORD -->

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >


            <!-- LOGIN BUTTON -->

            <button
                type="button"
                class="order-btn"
                id="loginButton"
            >
                Login
            </button>


            <!-- SIGN UP -->

            <a
                href="signup.html"
                class="back-btn"
            >
                Don't have an account? Sign Up
            </a>


            <!-- BACK TO STORE -->

            <a
                href="index.html"
                class="back-btn"
            >
                ← Back to Store
            </a>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Madiha Digital Store.
            All Rights Reserved.
        </p>

    </footer>


    <!-- LOGIN JAVASCRIPT -->

    <script src="login.js"></script>

</body>

</html>
