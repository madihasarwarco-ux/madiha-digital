<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Madiha Digital Store</title>

    <link rel="icon" type="image/png" href="imge2.png.png">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <img
            src="imge2.png.png.png"
            alt="Madiha"
            class="profile-pic"
        >

        <h1>Madiha Digital Store</h1>

        <p>Welcome Back</p>

    </header>


    <!-- LOGIN -->

    <section class="order-section">

        <div class="order-card">

            <h2>Login</h2>

            <p class="order-subtitle">
                Login to chat with us and place your order
            </p>


            <label for="loginEmail">
                Email Address
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >


            <button
                type="button"
                class="order-btn"
                id="loginButton"
            >
                Login
            </button>


            <p
                id="loginMessage"
                style="text-align:center; margin-top:15px;"
            ></p>


            <a
                href="signup.html"
                class="back-btn"
            >
                Don't have an account? Sign Up
            </a>


            <a
                href="index.html"
                class="back-btn"
            >
                ← Back to Store
            </a>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Madiha Digital Store.
            All Rights Reserved.
        </p>

    </footer>


    <!-- FIREBASE LOGIN -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyC5bLBjzBe65W897lAyQ04HJy2P5T2pX0Y",

            authDomain: "madiha-digital-store.firebaseapp.com",

            projectId: "madiha-digital-store",

            storageBucket: "madiha-digital-store.firebasestorage.app",

            messagingSenderId: "450607238935",

            appId: "1:450607238935:web:eb9a366df863f6bcad3152",

            measurementId: "G-H7MDD1B8Q0"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("loginMessage");


        loginButton.addEventListener(
            "click",
            async function () {

                const email =
                    document.getElementById("loginEmail").value.trim();

                const password =
                    document.getElementById("loginPassword").value;


                if (!email || !password) {

                    message.textContent =
                        "Please enter email and password.";

                    return;

                }


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    message.textContent =
                        "Login successful!";


                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        1000
                    );

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        "Login failed. Please check your email and password.";

                }

            }
        );

    </script>

</body>

</html>
