<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Madiha Digital Store</title>

    <link rel="icon" type="image/png" href="imge2.png.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <img
        src="imge2.png.png.png"
        alt="Madiha"
        class="profile-pic"
    >

    <h1>Madiha Digital Store</h1>

    <p>Create Your Account</p>

</header>


<section class="order-section">

    <div class="order-card">

        <h2>Create Account</h2>

        <p class="order-subtitle">
            Sign up to continue
        </p>


        <label for="signupName">
            Full Name
        </label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
        >


        <label for="signupEmail">
            Email Address
        </label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
        >


        <label for="signupPassword">
            Password
        </label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
        >


        <button
            type="button"
            class="order-btn"
            id="signupButton"
        >
            Create Account
        </button>


        <p
            id="signupMessage"
            style="text-align:center; margin-top:15px;"
        ></p>


        <a
            href="login.html"
            class="back-btn"
        >
            Already have an account? Login
        </a>


        <a
            href="index.html"
            class="back-btn"
        >
            ← Back to Store
        </a>

    </div>

</section>


<footer>

    <p>
        © 2026 Madiha Digital Store.
        All Rights Reserved.
    </p>

</footer>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    // CORRECT FIREBASE PROJECT

    const firebaseConfig = {

        apiKey: "AIzaSyC5bLBjzBe65W897lAyQ04HJyP2Y5T2pX0Y",

        authDomain:
            "madiha-digital-store.firebaseapp.com",

        projectId:
            "madiha-digital-store",

        storageBucket:
            "madiha-digital-store.firebasestorage.app",

        messagingSenderId:
            "450607238935",

        appId:
            "1:450607238935:web:eb9a366df863f6bcad3152",

        measurementId:
            "G-H7MDD1B8Q0"
    };


    // INITIALIZE FIREBASE

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // GET ELEMENTS

    const signupButton =
        document.getElementById("signupButton");

    const message =
        document.getElementById("signupMessage");


    // SIGN UP

    signupButton.addEventListener("click", async function () {

        const name =
            document
                .getElementById("signupName")
                .value
                .trim();


        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("signupPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        message.textContent = "";


        // CHECK EMPTY FIELDS

        if (!name || !email || !password || !confirmPassword) {

            message.textContent =
                "Please fill all fields.";

            return;
        }


        // CHECK PASSWORD

        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            return;
        }


        // PASSWORD LENGTH

        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        signupButton.disabled = true;

        signupButton.textContent =
            "Creating Account...";


        try {

            // CREATE FIREBASE ACCOUNT

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            // SAVE USER NAME

            await updateProfile(
                user,
                {
                    displayName: name
                }
            );


            // SAVE USER DATA IN FIRESTORE

            await setDoc(
                doc(db, "users", user.uid),
                {
                    name: name,
                    email: email,
                    createdAt: serverTimestamp()
                }
            );


            // SUCCESS MESSAGE

            message.textContent =
                "Account created successfully! ❤️";


            signupButton.textContent =
                "Account Created";


            // GO TO HOME PAGE

            setTimeout(function () {

                window.location.href =
                    "index.html";

            }, 1500);


        } catch (error) {

            console.error(error);

            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message.textContent =
                    "This email is already registered. Please Login.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "Please enter a valid email.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                message.textContent =
                    "Password is too weak. Use at least 6 characters.";

            }

            else {

                message.textContent =
                    "Error: " + error.message;

            }


            signupButton.disabled = false;

            signupButton.textContent =
                "Create Account";

        }

    });

</script>

</body>

</html>
