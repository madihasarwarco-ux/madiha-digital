<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Madiha Digital Store</title>

    <!-- Browser Tab Image -->
    <link rel="icon" type="image/png" href="imge3.png.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <!-- Madiha DP -->

        <img
            src="imge2.png.png.png"
            alt="Madiha"
            class="profile-pic"
        >

        <h1>Madiha Digital Store</h1>

        <p>Create Your Account</p>

    </header>


    <!-- SIGN UP SECTION -->

    <section class="order-section">

        <div class="order-card">

            <h2>Create Account</h2>

            <p class="order-subtitle">
                Sign up to continue
            </p>


            <!-- FULL NAME -->

            <label for="signupName">
                Full Name
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
            >


            <!-- EMAIL -->

            <label for="signupEmail">
                Email Address
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
            >


            <!-- PASSWORD -->

            <label for="signupPassword">
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
            >


            <!-- CONFIRM PASSWORD -->

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
            >


            <!-- CREATE ACCOUNT -->

            <button
                type="button"
                class="order-btn"
                id="signupButton"
            >
                Create Account
            </button>


            <!-- LOGIN -->

            <a
                href="login.html"
                class="back-btn"
            >
                Already have an account? Login
            </a>


            <!-- BACK TO STORE -->

            <a
                href="index.html"
                class="back-btn"
            >
                ← Back to Store
            </a>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Madiha Digital Store.
            All Rights Reserved.
        </p>

    </footer>


    <!-- SIGN UP JAVASCRIPT -->

    <script src="signup.js"></script>

</body>

</html>
