<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - Madiha Digital Store</title>

    <!-- Browser Tab Image -->
    <link rel="icon" type="image/png" href="imge2.png.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <!-- Small Profile Picture -->

        <img
            src="imge2.png.png"
            alt="Madiha"
            class="profile-pic"
        >

        <h1>Madiha Digital Store</h1>

        <p>Place Your Order</p>


        <!-- LOGIN / SIGN UP -->

        <div class="account-buttons">

            <a
                href="login.html"
                class="account-btn"
            >
                Login
            </a>

            <a
                href="signup.html"
                class="account-btn signup-btn"
            >
                Sign Up
            </a>

        </div>

    </header>


    <!-- ORDER SECTION -->

    <section class="order-section">


        <div class="order-card">


            <h2>Place Your Order</h2>


            <p class="order-subtitle">
                Please enter your details below
            </p>


            <!-- NAME -->

            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <!-- PHONE -->

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="03XXXXXXXXX"
            >


            <!-- ADDRESS -->

            <label for="address">
                Delivery Address
            </label>

            <textarea
                id="address"
                placeholder="Enter your complete address"
                rows="4"
            ></textarea>


            <!-- PRODUCT -->

            <label for="product">
                Select Product
            </label>

            <select id="product">

                <option value="600">
                    Natural Radiance Face Cream - Rs. 600
                </option>

                <option value="700">
                    Hathon Pao Ki Cream - Rs. 700
                </option>

            </select>


            <!-- QUANTITY -->

            <label for="quantity">
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
            >


            <!-- TOTAL -->

            <div class="total-box">

                <span>
                    Total Price:
                </span>

                <strong id="totalPrice">
                    Rs. 600
                </strong>

            </div>


            <!-- WHATSAPP ORDER -->

            <button
                type="button"
                class="order-btn"
                id="orderButton"
            >
                💬 Order on WhatsApp
            </button>


            <!-- BACK TO STORE -->

            <a
                href="index.html"
                class="back-btn"
            >
                ← Back to Store
            </a>


        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Madiha Digital Store.
            All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="place-order.js"></script>

</body>

</html>
