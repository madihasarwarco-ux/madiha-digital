<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - Madiha Digital Store</title>

    <link rel="icon" type="image/png" href="imge2.png.png">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <img
            src="imge2.png.png.png"
            alt="Madiha"
            class="profile-pic"
        >

        <h1>Madiha Digital Store</h1>

        <p>Place Your Order</p>

    </header>


    <section class="order-section">

        <div class="order-card">

            <h2>Place Your Order</h2>

            <p class="order-subtitle">
                Please enter your details below
            </p>


            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="03208046712"
            >


            <label for="address">
                Delivery Address
            </label>

            <textarea
                id="address"
                placeholder="Enter your complete address"
                rows="4"
            ></textarea>


            <label for="product">
                Select Product
            </label>

            <select id="product">

                <option
                    value="Natural Radiance Face Cream"
                    data-price="600"
                >
                    Natural Radiance Face Cream - Rs. 600
                </option>

                <option
                    value="Hathon Pao Ki Cream"
                    data-price="700"
                >
                    Hathon Pao Ki Cream - Rs. 700
                </option>

            </select>


            <label for="quantity">
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
            >


            <div class="total-box">

                <span>
                    Total Price:
                </span>

                <strong id="totalPrice">
                    Rs. 600
                </strong>

            </div>


            <button
                type="button"
                class="order-btn"
                id="orderButton"
            >
                Place Order
            </button>


            <p id="orderMessage"></p>


            <a
                href="index.html"
                class="back-btn"
            >
                ← Back to Store
            </a>

        </div>

    </section>


    <footer>

        <p>
            © 2026 Madiha Digital Store.
            All Rights Reserved.
        </p>

    </footer>


    <script>

        const product =
            document.getElementById("product");

        const quantity =
            document.getElementById("quantity");

        const totalPrice =
            document.getElementById("totalPrice");


        function calculateTotal() {

            const price =
                Number(
                    product.options[
                        product.selectedIndex
                    ].dataset.price
                );

            const qty =
                Number(quantity.value);

            totalPrice.textContent =
                "Rs. " + (price * qty);

        }


        product.addEventListener(
            "change",
            calculateTotal
        );


        quantity.addEventListener(
            "input",
            calculateTotal
        );


        document
            .getElementById("orderButton")
            .addEventListener(
                "click",
                function () {

                    const message =
                        document.getElementById(
                            "orderMessage"
                        );


                    const name =
                        document.getElementById(
                            "name"
                        ).value.trim();


                    const phone =
                        document.getElementById(
                            "phone"
                        ).value.trim();


                    const address =
                        document.getElementById(
                            "address"
                        ).value.trim();


                    const selectedProduct =
                        product.value;


                    const qty =
                        Number(quantity.value);


                    const price =
                        Number(
                            product.options[
                                product.selectedIndex
                            ].dataset.price
                        );


                    const total =
                        price * qty;


                    if (
                        !name ||
                        !phone ||
                        !address ||
                        qty < 1
                    ) {

                        message.style.color =
                            "#ff4444";

                        message.textContent =
                            "Please fill all details.";

                        return;

                    }


                    /* =========================
                       YOUR NEW WHATSAPP NUMBER
                       ========================= */

                    const whatsappNumber =
                        "923208046712";


                    const orderText =
                        "New Order - Madiha Digital Store\n\n" +
                        "Name: " + name + "\n" +
                        "Phone: " + phone + "\n" +
                        "Address: " + address + "\n" +
                        "Product: " + selectedProduct + "\n" +
                        "Quantity: " + qty + "\n" +
                        "Total: Rs. " + total;


                    const whatsappURL =
                        "https://wa.me/" +
                        whatsappNumber +
                        "?text=" +
                        encodeURIComponent(
                            orderText
                        );


                    message.style.color =
                        "#25d366";

                    message.textContent =
                        "Opening WhatsApp... ❤️";


                    setTimeout(function () {

                        window.open(
                            whatsappURL,
                            "_blank"
                        );

                    }, 500);

                }
            );

    </script>

</body>

</html>
